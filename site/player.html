<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選手詳細 | Shadowverse Premier Series 26-27 選手データ</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <h1><a href="index.html">Shadowverse Premier Series 26-27 選手データ</a></h1>
  <input type="checkbox" id="navToggle" class="nav-toggle-input">
  <label class="nav-toggle-label" for="navToggle" aria-label="メニュー"><span class="nav-toggle-bar"></span></label>
  <nav>
      <a class="nav-btn" href="index.html">順位表</a>
      <a class="nav-btn" href="team.html">チーム戦績</a>
      <a class="nav-btn" href="players.html">選手一覧</a>
      <a class="nav-btn" href="rounds.html">通算成績</a>
      <a class="nav-btn" href="sections.html">節別結果</a>
      <a class="nav-btn" href="compare.html">比較</a>
      <a class="nav-btn" href="beyond.html">BEYOND</a>
    </nav>
</header>
<main id="app">
  <div class="state state--loading" role="status"><span class="state__spinner" aria-hidden="true"></span><span>読み込み中</span></div>
</main>

<script src="common.js"></script>
<script src="stream-analysis.js"></script>
<script>
let chart = null;

function drawChart(history, name, metric, color) {
  const rows = history.filter(r => r.player_name === name && r.metric === metric).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const labels = rows.map(r => r.date);
  const data = rows.map(r => parseFloat(r.value));

  if (chart) chart.destroy();
  if (typeof Chart === "undefined") {
    document.querySelector(".chart-box").innerHTML = stateHTML("error", "グラフを表示できませんでした", "グラフの部品を読み込めませんでした。時間をおいて再読み込みしてください");
    return;
  }
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels, datasets: [{
      label: metricLabel(metric),
      data,
      borderColor: color,
      backgroundColor: color,
      spanGaps: true,
      tension: 0.25,
      pointRadius: 3,
    }] },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#6b7280" }, grid: { color: "#f0f1f3" } },
        y: { ticks: { color: "#6b7280" }, grid: { color: "#f0f1f3" }, reverse: isLowerBetter(metric) },
      },
    },
  });
}

async function boot() {
  const app = document.getElementById("app");
  const name = new URLSearchParams(location.search).get("name");

  let data, streams;
  try {
    data = await loadData();
  } catch (err) {
    app.innerHTML = loadErrorHTML(err);
    return;
  }
  const { players, history, images } = data;

  const player = players.find(p => p.player_name === name);
  if (!player) {
    app.innerHTML = `<a class="back-link" href="players.html">選手一覧に戻る</a>${stateHTML("empty", "選手が見つかりません", "選手一覧から選び直してください")}`;
    return;
  }
  // 配信は選手が決まってから、その1人分だけを読む（全員分の streams.json は読まない）
  streams = await loadStreams(player);

  // 折れ線グラフとして意味のある指標だけに絞る（Xフォロワー数・YouTube登録者数）。
  // 以前は shadowverse-reference.com 由来の「累積配信時間」もあったが、2026年10月中旬で取得元の
  // 更新が止まったため外した。配信の数字はページ下部の配信分析（YouTube から毎日取得）で見る。
  // ランクマッチ最高順位やPS戦績のような「推移として見せる価値が薄い/別タブで扱う」指標は含めない。
  const CHART_METRICS = [
    { id: "followers", requires: "followers" },
    { id: "youtube_subscribers", requires: "youtube_subscribers" },
  ];
  const rows = history.filter(r => r.player_name === name);
  const availableMetrics = new Set(rows.map(r => r.metric));
  const metrics = CHART_METRICS.filter(m => availableMetrics.has(m.requires)).map(m => m.id);

  const followers = latestValue(history, name, "followers");
  const yt = latestValue(history, name, "youtube_subscribers");
  const recentStreamSec = streams.length ? recentStreamSeconds(streams, 90) : null;
  const color = TEAM_COLORS[player.team_tag] || "#888";

  app.innerHTML = `
    <a class="back-link" href="players.html">選手一覧に戻る</a>
    <div class="detail-header">
      ${avatarHTML(player, images, 72)}
      <div class="info">
        <h2>${player.player_name}</h2>
        ${teamLogoHTML(player.team_tag, 24)}
        <span style="color:var(--text-muted); font-size:13px; margin-left:6px;">${player.team_name}</span>
      </div>
    </div>
    <div class="quick-stats">
      <div class="quick-stat">
        <div class="label">Xフォロワー数</div>
        <div class="value">${followers != null ? fmtNum(followers) : "-"}</div>
        ${player.x_url ? `<a href="${player.x_url}" target="_blank" rel="noopener" style="font-size:12px;">X</a>` : ""}
      </div>
      <div class="quick-stat">
        <div class="label">YouTube登録者数</div>
        <div class="value">${yt != null ? fmtNum(yt) : "-"}</div>
        ${player.youtube_url ? `<a href="${player.youtube_url}" target="_blank" rel="noopener" style="font-size:12px;">YouTube</a>` : ""}
      </div>
      <div class="quick-stat">
        <div class="label">直近90日の配信時間</div>
        <div class="value">${recentStreamSec != null ? fmtNum(Math.round(recentStreamSec / 360) / 10) + "h" : "-"}</div>
        <a href="#streamAnalysis" style="font-size:12px;">配信分析を見る</a>
      </div>
      <div class="quick-stat">
        <div class="label">PS公式戦</div>
        <div class="value" style="font-size:14px;">試合結果を見る</div>
        <a href="rounds.html?name=${encodeURIComponent(name)}" style="font-size:12px;">対戦履歴</a>
      </div>
      <div class="quick-stat">
        <div class="label">ランクマッチ</div>
        <div class="value" style="font-size:14px;">期間別のレート</div>
        <a href="beyond.html?name=${encodeURIComponent(name)}" style="font-size:12px;">BEYOND</a>
      </div>
    </div>
    ${metrics.length ? `
      <div class="control-row">
        <div class="control-group">
          <label>指標</label>
          <select id="metricSelect">${metrics.map(m => `<option value="${m}">${metricLabel(m)}</option>`).join("")}</select>
        </div>
        <a href="compare.html" style="font-size:13px;">比較する</a>
      </div>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    ` : stateHTML("empty", "この選手の推移データはまだありません")}
    <section class="stream-analysis" id="streamAnalysis"></section>
  `;

  if (metrics.length) {
    const sel = document.getElementById("metricSelect");
    // 初期選択は「Xフォロワー数」。以前は観測点が少なかったため累積配信時間にしていたが、
    // 2026-07-26からの日次データが溜まり、配信関連の取得元も10月中旬から更新が止まっているため変更した。
    if (metrics.includes("followers")) sel.value = "followers";
    sel.addEventListener("change", () => drawChart(history, name, sel.value, color));
    drawChart(history, name, sel.value, color);
  }
  renderStreamAnalysis(document.getElementById("streamAnalysis"), player, streams, color);
}

boot();
</script>
</body>
</html>
