<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選手比較 | Shadowverse Premier Series 26-27 選手データ</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="wide">
<header>
  <h1><a href="index.html">Shadowverse Premier Series 26-27 選手データ</a></h1>
  <input type="checkbox" id="navToggle" class="nav-toggle-input">
  <label class="nav-toggle-label" for="navToggle" aria-label="メニュー"><span class="nav-toggle-bar"></span></label>
  <nav>
      <a class="nav-btn" href="index.html">順位表</a>
      <a class="nav-btn" href="team.html">チーム戦績</a>
      <a class="nav-btn" href="players.html">選手一覧</a>
      <a class="nav-btn" href="rounds.html">通算成績</a>
      <a class="nav-btn" href="sections.html">節別結果</a>
      <a class="nav-btn active" href="compare.html">比較</a>
      <a class="nav-btn" href="beyond.html">BEYOND</a>
    </nav>
</header>
<main id="app">
  <div class="state state--loading" role="status"><span class="state__spinner" aria-hidden="true"></span><span>読み込み中</span></div>
</main>

<script src="common.js"></script>
<script>
let chart = null;
let selected = new Set();
let players = [], history = [];

// 折れ線グラフとして意味のある指標だけ（player.htmlと同じ考え方）。
// 「累積配信時間」は取得元（shadowverse-reference.com）の更新が2026年10月中旬で止まったため外した。
const CHART_METRICS = [
  { id: "followers", requires: "followers" },
  { id: "youtube_subscribers", requires: "youtube_subscribers" },
];

function seriesFor(metric, playerName) {
  const rows = history.filter(r => r.player_name === playerName && r.metric === metric).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  return { labels: rows.map(r => r.date), data: rows.map(r => parseFloat(r.value)) };
}

function drawCompareChart() {
  const metric = document.getElementById("metricSelect").value;
  const names = [...selected];

  // 選手ごとにX軸(labels)が違う可能性があるので、全員分のlabels（日付）を合成してから各系列をそこに合わせる。
  const allLabelsSet = new Set();
  const seriesByName = {};
  names.forEach(name => {
    const s = seriesFor(metric, name);
    seriesByName[name] = s;
    s.labels.forEach(l => allLabelsSet.add(l));
  });
  const rawLabels = [...allLabelsSet].sort();
  const labels = rawLabels;

  const datasets = names.map((name) => {
    const s = seriesByName[name];
    const byLabel = {};
    s.labels.forEach((l, idx) => byLabel[l] = s.data[idx]);
    // 選手ごとにバラバラの色を割り当てるのではなく、同じチームの選手は同じ色にする
    // （「チームごとに折れ線の色は変える」という要望に対応。個々の系列名はツールチップ/凡例で区別できる）。
    const player = players.find(p => p.player_name === name);
    const color = (player && TEAM_COLORS[player.team_tag]) || "#888";
    return {
      label: name,
      data: rawLabels.map(l => byLabel[l] ?? null),
      borderColor: color,
      backgroundColor: color,
      spanGaps: true,
      tension: 0.25,
      pointRadius: 2,
    };
  });

  if (chart) chart.destroy();
  const wrap = document.getElementById("chartWrap");
  if (!names.length) {
    wrap.innerHTML = stateHTML("empty", "比較したい選手を選んでください", "チームボタンか、下の選手のチップから選べます");
    return;
  }
  if (typeof Chart === "undefined") {
    wrap.innerHTML = stateHTML("error", "グラフを表示できませんでした", "グラフの部品を読み込めませんでした。時間をおいて再読み込みしてください");
    return;
  }
  wrap.innerHTML = `<canvas id="chart"></canvas>`;
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { position: "bottom", labels: { boxWidth: 10 } } },
      scales: {
        x: { ticks: { color: "#6b7280" }, grid: { color: "#f0f1f3" } },
        y: { ticks: { color: "#6b7280" }, grid: { color: "#f0f1f3" }, reverse: isLowerBetter(metric) },
      },
    },
  });
}

function renderChips() {
  const wrap = document.getElementById("playerChips");
  wrap.innerHTML = players.map(p => `
    <span class="player-chip ${selected.has(p.player_name) ? "active" : ""}" data-name="${encodeURIComponent(p.player_name)}">
      ${teamLogoHTML(p.team_tag, 16)}${p.player_name}
    </span>`).join("");
  wrap.querySelectorAll(".player-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const name = decodeURIComponent(chip.dataset.name);
      if (selected.has(name)) selected.delete(name); else selected.add(name);
      renderChips();
      renderTeamButtons();
      drawCompareChart();
    });
  });
}

function renderTeamButtons() {
  const teams = [...new Set(players.map(p => p.team_tag))];
  const wrap = document.getElementById("teamButtons");
  wrap.innerHTML = teams.map(t => {
    const teamPlayers = players.filter(p => p.team_tag === t);
    const allSelected = teamPlayers.every(p => selected.has(p.player_name));
    const color = TEAM_COLORS[t] || "#888";
    return `<button class="team-select-btn ${allSelected ? "active" : ""}" data-team="${t}"
      style="${allSelected ? `background:${color};` : ""}">${teamLogoHTML(t, 16)}${t}チーム全員</button>`;
  }).join("");
  wrap.querySelectorAll(".team-select-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = btn.dataset.team;
      const teamPlayers = players.filter(p => p.team_tag === t);
      const allSelected = teamPlayers.every(p => selected.has(p.player_name));
      teamPlayers.forEach(p => allSelected ? selected.delete(p.player_name) : selected.add(p.player_name));
      renderChips();
      renderTeamButtons();
      drawCompareChart();
    });
  });
}

// --- 表で比較（一覧比較表） ---
// 「一覧比較できるページ」の要望に対応。折れ線グラフ（1指標×選手を選んで重ねる）とは別に、
// 全選手を1つのスプレッドシート的な表にまとめ、列見出しクリックでソートできるようにする。
// 月間ポスト数（Xの投稿数）はスクレイピングが現実的に難しいため含めていない。
// 最高順位（crRank）はdata/svlabo_leaderboards.csv（全ユーザー分）から選手ごとの最良順位を
// 算出したもの（crBestRankForPlayer()参照）。BEYOND回数(100位以内)は同データから
// 「順位が100位以内だった回数」を数えたもの（crTopNCounts()参照）。
// 配信の列（回数・時間・平均再生数・時間あたり再生数）は data/stream_stats.json
// （scripts/build_site_data.py が YouTube の配信データから集計）を期間セレクタで切り替えて出す。
// 以前の「直近1ヶ月の配信」「配信時間」「動画本数」は shadowverse-reference.com 由来で、
// 2026年10月中旬に取得元の更新が止まったため置き換えた。
let matches = [];
let streamStats = null;
let svlabo = [];
let tableSort = { key: "followers", dir: "desc" };

function hexToRgba(hex, alpha) {
  const h = (hex || "#888888").replace("#", "");
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// 配信の列の期間。stream_stats.json の windows のキーと対応している。
const STREAM_TABLE_PERIODS = [
  { id: "30", label: "直近30日" },
  { id: "90", label: "直近90日" },
  { id: "all", label: "取得した全期間" },
];
let tablePeriod = "30";

// 選んだ期間の配信集計（無い選手・期間は null）
function streamStatFor(playerName, period) {
  const w = streamStats && streamStats.windows && streamStats.windows[period];
  const st = w && w[playerName];
  return st && st.count ? st : null;
}

function buildTableRows(players, history, images, matches, svlabo) {
  const cr100Counts = crTopNCounts(svlabo, 100);
  return players.map(player => {
    const followersRaw = latestValue(history, player.player_name, "followers");
    const ytRaw = latestValue(history, player.player_name, "youtube_subscribers");
    return {
      player, images,
      followers: followersRaw != null ? parseFloat(followersRaw) : null,
      yt: ytRaw != null ? parseFloat(ytRaw) : null,
      // 「今何人いるか」だけだと元から母数の大きい選手が常に上に来るので、
      // 直近30日でどれだけ動いたかを別列として出す。
      followersChange: changeOverDays(history, player.player_name, "followers", 30),
      ytChange: changeOverDays(history, player.player_name, "youtube_subscribers", 30),
      stats: summarizeMatches(matches, player.player_name),
      stream: streamStatFor(player.player_name, tablePeriod),
      // data/svlabo_leaderboards.csv（全ユーザー分）から選手ごとの最高順位を求める。
      // 以前はhistory.csvのcr_best_rank_overallを見ていたが、これは手動スクレイピングを
      // 実行した選手（Atomのみ）にしか値が入っておらず、他の選手が軒並み「-」になっていた。
      crRank: crBestRankForPlayer(svlabo, player),
      cr100: crCountForPlayer(cr100Counts, player),
    };
  });
}

const TABLE_COLUMNS = [
  { key: "team", label: "チーム", defaultDir: "asc",
    sortValue: r => r.player.team_tag || "",
    render: r => `${teamLogoHTML(r.player.team_tag, 20)} <span style="margin-left:4px;">${r.player.team_tag}</span>` },
  { key: "name", label: "名前", defaultDir: "asc",
    sortValue: r => r.player.player_name || "",
    render: r => `<a class="player-link" href="player.html?name=${encodeURIComponent(r.player.player_name)}">${avatarHTML(r.player, r.images, 22)}${r.player.player_name}</a>` },
  { key: "followers", label: "フォロワー", defaultDir: "desc",
    sortValue: r => r.followers ?? -1,
    render: r => r.followers != null ? fmtNum(r.followers) : "-" },
  { key: "followersChange", label: "フォロワー30日", defaultDir: "desc",
    sortValue: r => r.followersChange ? r.followersChange.diff : -Infinity,
    render: r => formatChange(r.followersChange) },
  { key: "yt", label: "登録者", defaultDir: "desc",
    sortValue: r => r.yt ?? -1,
    render: r => r.yt != null ? fmtNum(r.yt) : "-" },
  { key: "ytChange", label: "登録者30日", defaultDir: "desc",
    sortValue: r => r.ytChange ? r.ytChange.diff : -Infinity,
    render: r => formatChange(r.ytChange) },
  { key: "ps", label: "戦績", defaultDir: "desc",
    sortValue: r => r.stats.points,
    render: r => r.stats.played ? `${r.stats.wins}勝${r.stats.losses}敗` : "-" },
  { key: "streamCount", label: "配信回数", defaultDir: "desc",
    sortValue: r => r.stream ? r.stream.count : -1,
    render: r => r.stream ? `${fmtNum(r.stream.count)}回` : "-" },
  { key: "streamHours", label: "配信時間", defaultDir: "desc",
    sortValue: r => r.stream ? r.stream.total_sec : -1,
    render: r => r.stream ? `${fmtNum(Math.round(r.stream.total_sec / 360) / 10)}h` : "-" },
  { key: "streamAvgViews", label: "平均再生数", defaultDir: "desc",
    sortValue: r => r.stream && r.stream.avg_views != null ? r.stream.avg_views : -1,
    render: r => r.stream && r.stream.avg_views != null ? fmtNum(r.stream.avg_views) : "-" },
  { key: "streamVph", label: "1時間あたり再生数", defaultDir: "desc",
    sortValue: r => r.stream && r.stream.views_per_hour != null ? r.stream.views_per_hour : -1,
    render: r => r.stream && r.stream.views_per_hour != null ? fmtNum(r.stream.views_per_hour) : "-" },
  { key: "crrank", label: "最高順位", defaultDir: "asc",
    sortValue: r => r.crRank ?? Infinity,
    render: r => r.crRank != null ? fmtNum(r.crRank) + "位" : "-" },
  { key: "cr100", label: "BEYOND回数", defaultDir: "desc",
    sortValue: r => r.cr100,
    render: r => fmtNum(r.cr100) },
];

function periodOptionsHTML() {
  return STREAM_TABLE_PERIODS.map(p => `<option value="${p.id}">${p.label}</option>`).join("");
}

function renderTableMode(container) {
  function draw() {
    // 期間を切り替えると配信の列の値が変わるので、その都度組み直す
    const rows = buildTableRows(players, history, images, matches, svlabo);
    const col = TABLE_COLUMNS.find(c => c.key === tableSort.key);
    const sorted = rows.slice().sort((a, b) => {
      const av = col.sortValue(a), bv = col.sortValue(b);
      let cmp;
      if (typeof av === "string") cmp = av.localeCompare(bv, "ja");
      else cmp = av - bv;
      return tableSort.dir === "asc" ? cmp : -cmp;
    });

    const thead = TABLE_COLUMNS.map(c => {
      const active = c.key === tableSort.key;
      const arrow = active ? (tableSort.dir === "asc" ? "▲" : "▼") : "";
      return `<th class="sortable ${active ? "active" : ""}" data-key="${c.key}">${c.label}<span class="sort-arrow">${arrow}</span></th>`;
    }).join("");

    const body = sorted.map(r => `
      <tr class="team-row-stripe" style="border-left-color:${TEAM_COLORS[r.player.team_tag] || "#888"}; background:${hexToRgba(TEAM_COLORS[r.player.team_tag] || "#888888", 0.05)};">
        ${TABLE_COLUMNS.map(c => `<td>${c.render(r)}</td>`).join("")}
      </tr>`).join("");

    container.innerHTML = `
      <div class="control-row">
        <div class="control-group">
          <label for="tablePeriodSelect">期間（配信の列）</label>
          <select id="tablePeriodSelect">${periodOptionsHTML()}</select>
        </div>
        <div class="compare-note">配信の列は YouTube のライブアーカイブ（Twitch は含まない）の集計です。${streamStats ? `${escapeAttr(streamStats.as_of)} 時点。` : "配信の集計データを読み込めませんでした。"}1時間あたり再生数は、再生数の合計を配信時間の合計で割った値です。</div>
      </div>
      <div class="table-scroll"><table class="rank-table nowrap"><thead><tr>${thead}</tr></thead><tbody>${body}</tbody></table></div>
    `;
    const periodSel = container.querySelector("#tablePeriodSelect");
    periodSel.value = tablePeriod;
    periodSel.addEventListener("change", () => { tablePeriod = periodSel.value; draw(); });

    container.querySelectorAll("th.sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        const c = TABLE_COLUMNS.find(x => x.key === key);
        if (tableSort.key === key) tableSort.dir = tableSort.dir === "asc" ? "desc" : "asc";
        else tableSort = { key, dir: c.defaultDir };
        draw();
      });
    });
  }
  draw();
}

// --- グラフで比較（既存の折れ線グラフ機能） ---

function renderGraphMode(container) {
  const availableMetrics = new Set(history.map(r => r.metric));
  const metrics = CHART_METRICS.filter(m => availableMetrics.has(m.requires)).map(m => m.id);

  if (!metrics.length) {
    container.innerHTML = stateHTML("empty", "まだ比較できるデータがありません");
    return;
  }

  container.innerHTML = `
    <div class="control-row">
      <div class="control-group">
        <label>指標</label>
        <select id="metricSelect">${metrics.map(m => `<option value="${m}">${metricLabel(m)}</option>`).join("")}</select>
      </div>
    </div>
    <div class="control-group" style="margin-bottom:6px;">
      <label>チームで一括選択</label>
      <div class="team-select-row" id="teamButtons"></div>
    </div>
    <div class="control-group" style="margin-bottom:16px;">
      <label>選手を個別に選択</label>
      <div class="team-select-row" style="margin-bottom:6px;">
        <button class="team-select-btn" id="selectAllBtn">全選択</button>
        <button class="team-select-btn" id="deselectAllBtn">全解除</button>
      </div>
      <div class="player-chip-list" id="playerChips"></div>
    </div>
    <div class="chart-box" id="chartWrap"></div>
  `;

  // 初期表示は「今選ばれている指標を全選手分比較した状態」にする（選ぶ手間を無くす）。
  // 多すぎて見づらい場合は下の「全解除」ボタンで一旦クリアできる。
  players.forEach(p => selected.add(p.player_name));

  // 初期選択の指標は先頭の「Xフォロワー数」
  const metricSelect = document.getElementById("metricSelect");

  metricSelect.addEventListener("change", drawCompareChart);
  document.getElementById("selectAllBtn").addEventListener("click", () => {
    players.forEach(p => selected.add(p.player_name));
    renderChips(); renderTeamButtons(); drawCompareChart();
  });
  document.getElementById("deselectAllBtn").addEventListener("click", () => {
    selected.clear();
    renderChips(); renderTeamButtons(); drawCompareChart();
  });
  renderTeamButtons();
  renderChips();
  drawCompareChart();
}

let images = {};

function renderModeSwitcher(app, mode) {
  app.innerHTML = `
    <div class="team-select-row" style="margin-bottom:14px;">
      <button class="team-select-btn ${mode === "table" ? "active" : ""}" id="modeTableBtn"
        style="${mode === "table" ? "background:var(--accent);" : ""}">表で比較</button>
      <button class="team-select-btn ${mode === "graph" ? "active" : ""}" id="modeGraphBtn"
        style="${mode === "graph" ? "background:var(--accent);" : ""}">グラフで比較</button>
    </div>
    <div id="modeContent"></div>
  `;
  document.getElementById("modeGraphBtn").addEventListener("click", () => renderModeSwitcher(app, "graph"));
  document.getElementById("modeTableBtn").addEventListener("click", () => renderModeSwitcher(app, "table"));

  const content = document.getElementById("modeContent");
  if (mode === "table") renderTableMode(content);
  else renderGraphMode(content);
}

async function boot() {
  const app = document.getElementById("app");
  let data;
  try {
    [data, matches, svlabo, streamStats] = await Promise.all([loadData(), loadMatches(), loadSvlaboLeaderboard(), loadStreamStats()]);
  } catch (err) {
    app.innerHTML = loadErrorHTML(err);
    return;
  }
  players = data.players;
  history = data.history;
  images = data.images;

  renderModeSwitcher(app, "table");
}

boot();
</script>
</body>
</html>
