<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>選手一覧 | Shadowverse Premier Series 26-27 選手データ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><a href="index.html">Shadowverse Premier Series 26-27 選手データ</a></h1>
  <input type="checkbox" id="navToggle" class="nav-toggle-input">
  <label class="nav-toggle-label" for="navToggle" aria-label="メニュー"><span class="nav-toggle-bar"></span></label>
  <nav>
      <a class="nav-btn active" href="index.html">順位表</a>
      <a class="nav-btn" href="players.html">選手一覧</a>
      <a class="nav-btn" href="rounds.html">通算成績</a>
      <a class="nav-btn" href="sections.html">節別結果</a>
      <a class="nav-btn" href="compare.html">比較</a>
      <a class="nav-btn" href="beyond.html">BEYOND</a>
    </nav>
</header>
<main id="app">
  <div class="empty-note">読み込み中...</div>
</main>

<script src="common.js"></script>
<script>
// 「次の節」パネル。カレンダーは作らない方針にした（シーズン7ヶ月で開催日が23日しかなく、
// 月グリッドにすると30マス中3マス程度しか埋まらないため）。代わりに、まだ消化していない
// 試合が残っている一番小さい節だけを、日付・曜日・時刻・対戦カード付きで大きく出す。
// 時刻は公式が直前に発表するので、未発表の節は「時刻未定」と出す。
function nextSectionHTML(schedule) {
  const next = findNextSection(schedule);
  if (!next) {
    if (!schedule.length) return "";   // schedule.csvがまだ無い場合は何も出さない
    return `<div class="next-section"><div class="next-section__label">全日程終了</div></div>`;
  }
  const days = next.days.map(d => {
    const cards = d.rounds.map(r => {
      const done = r.score1 !== "" && r.score2 !== "";
      return `
        <div class="next-card ${done ? "is-done" : ""}">
          <span class="next-card__team">${teamLogoHTML(r.team1, 22)}<span>${r.team1}</span></span>
          <span class="next-card__score">${done ? `${r.score1} - ${r.score2}` : "vs"}</span>
          <span class="next-card__team -right"><span>${r.team2}</span>${teamLogoHTML(r.team2, 22)}</span>
        </div>`;
    }).join("");
    const allDone = d.rounds.every(r => r.score1 !== "");
    return `
      <div class="next-day ${allDone ? "is-done" : ""}">
        <div class="next-day__head">
          <span class="next-day__date">${shortDate(d.date)}<span class="next-day__wd">(${weekdayJa(d.weekday)})</span></span>
          <span class="next-day__time">${d.time ? d.time + "~" : "時刻未定"}</span>
          ${d.half ? `<span class="next-day__half">${d.half}</span>` : ""}
          ${allDone ? `<span class="next-day__done">終了</span>` : ""}
        </div>
        ${cards}
      </div>`;
  }).join("");

  return `
    <div class="next-section">
      <div class="next-section__label">次の節</div>
      <div class="next-section__title">第${next.section}節</div>
      <div class="next-section__days">${days}</div>
      <a class="next-section__link" href="sections.html">節別結果を見る</a>
    </div>`;
}

async function boot() {
  const app = document.getElementById("app");
  let data, matches, resultJson, schedule;
  try {
    [data, matches, resultJson, schedule] =
      await Promise.all([loadData(), loadMatches(), loadResultJson(), loadSchedule()]);
  } catch (err) {
    app.innerHTML = `<div class="error-banner">データ読み込みエラー: ${err.message}</div>`;
    return;
  }

  const { players, history, images } = data;
  const { list: standings, source } = computeTeamStandings(players, matches, resultJson);
  const hasRank = source !== "none";

  const header = hasRank ? `
    <div class="standings-header">
      <span class="col-rank">順位</span>
      <span class="col-logo">ロゴ</span>
      <span class="col-name">チーム名</span>
      <span class="col-num">WIN</span>
      <span class="col-num">LOSE</span>
      <span class="col-num">W/L DIFF</span>
      <span class="col-num">BATTLE POINT</span>
      <span class="col-chevron"></span>
    </div>` : "";

  const blocks = standings.map((team, i) => {
    // ここは順位表なので、主役はあくまでチームの成績。
    // 以前は選手一覧と同じ .player-card（フォロワー数・登録者数つき）を並べていたが、
    // 選手一覧ページ(players.html)と見た目がほぼ同じになり「2ページある意味が分からない」
    // 状態だったため、所属選手は名前だけの軽い一覧に変えた。
    // 数字付きのカードで選手を見たいときは選手一覧へ誘導する。
    const roster = team.players.map(p => `
      <a class="roster__item" href="player.html?name=${encodeURIComponent(p.player_name)}">
        ${avatarHTML(p, images, 26)}<span>${p.player_name}</span>
      </a>`).join("");
    const diff = team.diff || 0;
    const diffText = diff > 0 ? `+${diff}` : `${diff}`;
    const row = hasRank ? `
      <span class="col-rank">${team.rank}</span>
      <span class="col-logo">${teamLogoHTML(team.team_tag, 32)}</span>
      <span class="col-name">${team.team_name}</span>
      <span class="col-num">${team.wins}</span>
      <span class="col-num">${team.losses}</span>
      <span class="col-num">${diffText}</span>
      <span class="col-num">${fmtNum(team.points)}</span>
    ` : `
      ${teamLogoHTML(team.team_tag, 28)}
      <span class="team-title">${team.team_name}</span>
      <span class="team-points">試合結果はまだありません</span>
    `;
    return `
      <details class="team-block" ${i === 0 && hasRank ? "open" : ""}>
        <summary>
          ${row}
          <span class="chevron">▼</span>
        </summary>
        <div class="team-panel">
          <div class="roster">${roster}</div>
          <a class="roster__more" href="players.html?team=${encodeURIComponent(team.team_tag)}">
            ${team.team_tag}の選手を一覧で見る
          </a>
        </div>
      </details>`;
  }).join("");

  app.innerHTML = nextSectionHTML(schedule) + header + blocks;
}

boot();
</script>
</body>
</html>
