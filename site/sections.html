<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>節別結果 | Shadowverse Premier Series 26-27 選手データ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><a href="index.html">Shadowverse Premier Series 26-27 選手データ</a></h1>
  <nav>
    <a class="nav-btn" href="index.html">選手一覧</a>
    <a class="nav-btn" href="ranking.html">ランキング</a>
    <a class="nav-btn" href="rounds.html">通算成績</a>
    <a class="nav-btn active" href="sections.html">節別結果</a>
    <a class="nav-btn" href="compare.html">比較</a>
    <a class="nav-btn" href="beyond.html">BEYOND</a>
  </nav>
</header>
<main id="app">
  <div class="empty-note">読み込み中...</div>
</main>

<script src="common.js"></script>
<script>
// このページはsvlabo.jpの節別記事から取り込んだ「節ごとのROUND/BATTLE詳細」専用。
// 以前はrounds.html（通算成績）の中のページ内タブだったが、通算成績とは見る目的が
// 別物（こちらは「第N節で何が起きたか」を試合単位で追う）で利用頻度も高いため、
// ナビの第1階層に独立させた。旧URL rounds.html?view=sections はこのページへ転送される。
let playerLookup = {};
function playerNameLinkHTML(rawName) {
  const p = lookupPlayer(playerLookup, rawName);
  if (!p) return rawName;
  return `<a class="player-link" href="player.html?name=${encodeURIComponent(p.player_name)}">${rawName}</a>`;
}

async function boot() {
  const app = document.getElementById("app");
  let data, battleDetails;
  try {
    [data, battleDetails] = await Promise.all([loadData(), loadBattleDetails()]);
  } catch (err) {
    app.innerHTML = `<div class="error-banner">データ読み込みエラー: ${err.message}</div>`;
    return;
  }
  playerLookup = buildPlayerLookup(data.players);
  renderSectionsView(app, battleDetails);
}

function renderSectionsView(container, battleDetails) {
  if (!battleDetails.length) {
    container.innerHTML = `<div class="empty-note">まだ節別詳細のデータがありません</div>`;
    return;
  }
  // 選択肢は節番号の小さい順に並べるが、初期選択は一番大きい節（＝最新節）にする。
  // 見たいのはたいてい直近の結果なので、開いた時点でそれが出ている方が手数が少ない。
  const sections = [...new Set(battleDetails.map(b => b.section))].sort((a, b) => a - b);
  const latest = sections[sections.length - 1];
  container.innerHTML = `
    <div class="control-row">
      <div class="control-group">
        <label>節</label>
        <select id="sectionSelect">${sections.map(s =>
          `<option value="${s}"${s === latest ? " selected" : ""}>${s}節</option>`).join("")}</select>
      </div>
    </div>
    <div id="roundsWrap"></div>
  `;
  const sel = container.querySelector("#sectionSelect");
  sel.addEventListener("change", () => renderSection(container, battleDetails, sel.value));
  renderSection(container, battleDetails, sel.value);
}

function renderSection(container, battleDetails, section) {
  const rows = battleDetails.filter(b => b.section === section);

  // half+round_noでグルーピングしつつ、元の並び順（前半戦R1→前半戦R2→後半戦R1→後半戦R2）を保つ
  const groups = {};
  const order = [];
  rows.forEach(b => {
    const key = b.half + "|" + b.round_no;
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(b);
  });

  const html = order.map(key => {
    const list = groups[key];
    const first = list[0];
    const body = list.map(battleRowHTML).join("");
    return `
      <div class="chart-box" style="margin-bottom:16px;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
          <span style="font-weight:700; font-size:13px; color:var(--text-muted);">${first.half} ROUND ${first.round_no}</span>
          <span style="flex:1;"></span>
          ${teamLogoHTML(first.team1, 26)}
          <span style="font-size:13px; font-weight:600;">${first.team1}</span>
          <span style="color:var(--text-muted); font-size:12px;">vs</span>
          ${teamLogoHTML(first.team2, 26)}
          <span style="font-size:13px; font-weight:600;">${first.team2}</span>
        </div>
        <table class="rank-table">
          <thead><tr><th>BATTLE</th><th>${first.team1}側</th><th></th><th>${first.team2}側</th><th>結果</th><th>配信</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>`;
  }).join("");

  container.querySelector("#roundsWrap").innerHTML = html;
}

function battleRowHTML(b) {
  const t1win = b.winlose === "WIN";
  return `
    <tr>
      <td>
        BATTLE${b.battle_no}
        <div style="font-size:10px;color:var(--text-muted);">${b.team1}側:${b.fise}</div>
      </td>
      <td>
        <div>${playerNameLinkHTML(b.player1)}</div>
        ${classPoolHTML(b.class1_pool, b.class1_used, 18)}
      </td>
      <td style="text-align:center;color:var(--text-muted);font-size:11px;">vs</td>
      <td>
        <div>${playerNameLinkHTML(b.player2)}</div>
        ${classPoolHTML(b.class2_pool, b.class2_used, 18)}
      </td>
      <td>
        <span class="result-badge ${t1win ? "win" : "lose"}">${b.team1} ${t1win ? "勝ち" : "負け"}</span>
      </td>
      <td>${b.video_url ? `<a href="${b.video_url}" target="_blank" rel="noopener" style="font-size:12px;">配信</a>` : "-"}</td>
    </tr>`;
}

boot();
</script>
</body>
</html>
