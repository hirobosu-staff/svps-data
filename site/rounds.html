<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通算成績 | Shadowverse Premier Series 26-27 選手データ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><a href="index.html">Shadowverse Premier Series 26-27 選手データ</a></h1>
  <nav>
    <a class="nav-btn" href="index.html">選手一覧</a>
    <a class="nav-btn" href="ranking.html">ランキング</a>
    <a class="nav-btn active" href="rounds.html">通算成績</a>
    <a class="nav-btn" href="sections.html">節別結果</a>
    <a class="nav-btn" href="compare.html">比較</a>
    <a class="nav-btn" href="beyond.html">BEYOND</a>
  </nav>
</header>
<main id="app">
  <div class="empty-note">読み込み中...</div>
</main>

<script src="common.js"></script>
<script>
// このページは「選手ごとの通算成績」。
// - ?name=選手名 が付いていれば、その選手の個人成績（対戦履歴・配信リンク）を表示
// - それ以外は全選手のリーダーボードを表示
// 節ごとのROUND/BATTLE詳細は sections.html（ナビの「節別結果」）に分離した。
// 以前はこのページ内のボタンで切り替える作りだったが、見る目的が別物で利用頻度も高いため、
// ナビの第1階層に独立させている。

async function boot() {
  const app = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  // 節別詳細は sections.html に分離したので、旧URLで来た人はそちらへ転送する
  if (params.get("view") === "sections") { location.replace("sections.html"); return; }
  const name = params.get("name");

  let data, matches, battleDetails;
  try {
    [data, matches, battleDetails] = await Promise.all([loadData(), loadMatches(), loadBattleDetails()]);
  } catch (err) {
    app.innerHTML = `<div class="error-banner">データ読み込みエラー: ${err.message}</div>`;
    return;
  }
  const { players, images } = data;

  if (name) {
    renderPlayerMatches(app, players, images, matches, battleDetails, name);
    return;
  }

  if (!matches.length) {
    app.innerHTML = `<div class="empty-note">まだ対戦データがありません</div>`;
    return;
  }

  renderLeaderboard(app, players, images, matches);
}

// 勝敗数(戦績)は1勝=1ptなので、獲得ポイントは戦績と完全に重複する情報として列自体を削除している。
// 各列見出しはクリックでソートできる（compare.htmlの「表で比較」と同じ考え方）。
let leaderboardSort = { key: "wins", dir: "desc" };
const LEADERBOARD_COLUMNS = [
  { key: "team", label: "チーム", defaultDir: "asc", sortValue: r => r.player.team_tag || "" },
  { key: "name", label: "選手", defaultDir: "asc", sortValue: r => r.player.player_name || "" },
  // 勝数だけで比較すると2勝1敗と2勝0敗が同値になり順位表示と行の並びがズレるため、
  // 「順位」の判定(assignCompetitionRanksのkeyFn)と同じ計算式でタイブレークする
  // (勝数が多い順、勝数が同じなら負け数が少ない順)。
  { key: "wins", label: "戦績", defaultDir: "desc", sortValue: r => r.stats.wins * 100000 - r.stats.losses },
  { key: "winRate", label: "勝率", defaultDir: "desc", sortValue: r => r.stats.winRate ?? -1 },
];

function renderLeaderboard(container, players, images, matches) {
  if (!matches.length) {
    container.innerHTML = `<div class="empty-note">まだPS公式戦の試合結果がありません</div>`;
    return;
  }
  const all = players.map(p => ({ player: p, stats: summarizeMatches(matches, p.player_name) }));

  // 表示列のソート順とは別に、「順位」自体は常に戦績(勝数→負け数)による実際の成績で決める。
  // 勝率は勝数0の選手だと常に0%になり負け数の違いを区別できない(0勝1敗も0勝2敗も0%)ため、
  // タイブレークには勝率ではなく負け数を直接使う。assignCompetitionRanksはリストが既に
  // keyFnと同じ順序でソートされている前提で動くので、ソート条件とkeyFnを完全に一致させる。
  const rankKey = r => r.stats.wins * 100000 - r.stats.losses;
  const standings = all.filter(r => r.stats.played > 0).slice()
    .sort((a, b) => rankKey(b) - rankKey(a));
  assignCompetitionRanks(standings, rankKey);
  const rankByPlayer = {};
  standings.forEach(r => { rankByPlayer[r.player.player_name] = r.rank; });

  function draw() {
    const col = LEADERBOARD_COLUMNS.find(c => c.key === leaderboardSort.key);
    const played = all.filter(r => r.stats.played > 0).slice().sort((a, b) => {
      const av = col.sortValue(a), bv = col.sortValue(b);
      const cmp = typeof av === "string" ? av.localeCompare(bv, "ja") : av - bv;
      return leaderboardSort.dir === "asc" ? cmp : -cmp;
    });
    const unplayed = all.filter(r => r.stats.played === 0);
    const rows = played.concat(unplayed);

    // メダル色は「戦績が良い順」の並びの時だけ意味を持つので、それ以外の列でソートしている間は付けない
    const isRankOrder = leaderboardSort.key === "wins" && leaderboardSort.dir === "desc";
    const medal = ["gold", "silver", "bronze"];
    const body = rows.map((r) => {
      const { player, stats } = r;
      const isPlayed = stats.played > 0;
      const rank = isPlayed ? rankByPlayer[player.player_name] : null;
      const rankClass = isPlayed && isRankOrder && rank <= 3 ? (medal[rank - 1] || "") : "";
      return `
        <tr>
          <td><span class="rank-num ${rankClass}">${isPlayed ? rank : "-"}</span></td>
          <td>${teamLogoHTML(player.team_tag, 22)}</td>
          <td>
            <a class="player-link" href="player.html?name=${encodeURIComponent(player.player_name)}">
              ${avatarHTML(player, images, 28)}
              ${player.player_name}
            </a>
          </td>
          <td>${isPlayed
            ? `<a href="rounds.html?name=${encodeURIComponent(player.player_name)}">${stats.wins}勝${stats.losses}敗</a>`
            : `${stats.wins}勝${stats.losses}敗`}</td>
          <td>${isPlayed ? (stats.winRate * 100).toFixed(0) + "%" : "-"}</td>
        </tr>`;
    }).join("");

    const thead = LEADERBOARD_COLUMNS.map(c => {
      const active = c.key === leaderboardSort.key;
      const arrow = active ? (leaderboardSort.dir === "asc" ? "▲" : "▼") : "";
      return `<th class="sortable ${active ? "active" : ""}" data-key="${c.key}">${c.label}<span class="sort-arrow">${arrow}</span></th>`;
    }).join("");

    container.innerHTML = `
      <div id="leaderboardTableWrap">
        <table class="rank-table">
          <thead><tr><th>#</th>${thead}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    `;
    container.querySelectorAll("th.sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        const c = LEADERBOARD_COLUMNS.find(x => x.key === key);
        if (leaderboardSort.key === key) leaderboardSort.dir = leaderboardSort.dir === "asc" ? "desc" : "asc";
        else leaderboardSort = { key, dir: c.defaultDir };
        draw();
      });
    });
  }
  draw();
}

function renderPlayerMatches(app, players, images, matches, battleDetails, name) {
  const player = players.find(p => p.player_name === name);
  if (!player) {
    app.innerHTML = `<a class="back-link" href="rounds.html">通算成績に戻る</a><div class="empty-note">選手が見つかりません</div>`;
    return;
  }

  const rows = matches.filter(m => m.player_name === name).slice().sort((a, b) => a.round < b.round ? -1 : 1);
  const stats = summarizeMatches(matches, name);

  // 全試合は必ずどこかの節に属している（match_results.csvのround列＝試合日時は全行に必ず
  // 入っている）ので、節番号が「-」になることは無い。まずはbattle_details.csv（svlabo.jp由来）
  // の実際のsection値を突き合わせて使い、まだsvlabo.jpの記事が出ていない節はround（試合日時）の
  // 登場順から節番号を組み立てる（同じ日付＝同じ節。全選手・全試合を通じた日付の早い順で採番する
  // ので、battle_details.csvの番号ともズレない）。
  const sectionDatesInOrder = [...new Set(matches.map(m => (String(m.round).match(/^\d{4}\.\d{2}\.\d{2}/) || [m.round])[0]))].sort();
  function sectionNumberFor(round) {
    const d = (String(round).match(/^\d{4}\.\d{2}\.\d{2}/) || [round])[0];
    const idx = sectionDatesInOrder.indexOf(d);
    return idx >= 0 ? idx + 1 : null;
  }

  // match_results.csv(公式サイト由来)とbattle_details.csv(svlabo.jp由来)は採番方式が別なので
  // チーム対戦カード+選手名で突き合わせる（findBattleDetail()参照）。見つかれば「使用したが
  // 登録していなかった他のクラス」も併せて表示し、配信の該当タイムスタンプへのリンクを出す。
  // 見つからない場合（まだsvlabo.jpの記事が出ていない節など）は、これまで通り使用クラスの
  // アイコン単体・配信リンク無しで表示する（節番号自体はround日時から必ず出せる）。
  const body = rows.map(r => {
    const detail = findBattleDetail(battleDetails, r.team_tag, r.player_name, r.opponent_team_tag);
    const classCell = detail ? classPoolHTML(detail.pool, detail.used, 18) : `<span class="vs-cell">${classIconHTML(r.class)}</span>`;
    const section = (detail && detail.section) || sectionNumberFor(r.round);
    return `
    <tr>
      <td>第${section}節</td>
      <td>${classCell}</td>
      <td>
        <span class="vs-cell">
          ${teamLogoHTML(r.opponent_team_tag, 18)}
          ${r.opponent_name
            ? `<a href="player.html?name=${encodeURIComponent(r.opponent_name)}">${r.opponent_name}</a>`
            : "-"}
          ${classIconHTML(r.opponent_class)}
        </span>
      </td>
      <td><span class="result-badge ${r.result === 'WIN' ? 'win' : 'lose'}">${r.result === 'WIN' ? '勝ち' : '負け'}</span></td>
      <td>${detail && detail.video_url ? `<a href="${detail.video_url}" target="_blank" rel="noopener" style="font-size:12px;">配信</a>` : "-"}</td>
    </tr>`;
  }).join("");

  app.innerHTML = `
    <a class="back-link" href="rounds.html">通算成績に戻る</a>
    <div class="detail-header">
      <a href="player.html?name=${encodeURIComponent(player.player_name)}">${avatarHTML(player, images, 56)}</a>
      <div class="info">
        <h2 style="font-size:20px;">
          <a class="player-link" href="player.html?name=${encodeURIComponent(player.player_name)}">${player.player_name}</a>
        </h2>
        ${teamLogoHTML(player.team_tag, 24)}
      </div>
    </div>
    <div class="quick-stats">
      <div class="quick-stat"><div class="label">戦績</div><div class="value">${stats.wins}勝${stats.losses}敗</div></div>
      <div class="quick-stat"><div class="label">勝率</div><div class="value">${stats.played ? (stats.winRate * 100).toFixed(0) + "%" : "-"}</div></div>
      <div class="quick-stat">
        <div class="label">選手ページ</div>
        <div class="value" style="font-size:14px;">配信・SNSの推移</div>
        <a href="player.html?name=${encodeURIComponent(player.player_name)}" style="font-size:12px;">選手詳細</a>
      </div>
    </div>
    <div class="table-scroll">
      <table class="rank-table">
        <thead><tr><th>節</th><th>使用クラス</th><th>対戦相手</th><th>結果</th><th>配信</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  `;
}

boot();
</script>
</body>
</html>
